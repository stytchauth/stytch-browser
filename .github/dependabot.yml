version: 2
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
    schedule:
      interval: 'weekly'
    # Suppress routine version-update PRs. Security update PRs are exempt from this
    # limit, so vulnerability fixes still open on the schedule below.
    open-pull-requests-limit: 0
    cooldown:
      default-days: 3
    ignore:
      # later uuid versions move to ESM which breaks build. The security alerts are not for
      # uuidv4 which is the only one we use
      - dependency-name: 'uuid'
        versions: ['<11.1.1']
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
